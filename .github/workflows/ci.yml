name: SpendWise CI Pipeline

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend Lint, Test & Build (Node.js + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spendwise
          POSTGRES_PASSWORD: spendwise_password
          POSTGRES_DB: spendwise_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://spendwise:spendwise_password@localhost:5432/spendwise_test_db?schema=public
      JWT_ACCESS_SECRET: ci-test-jwt-access-secret-minimum-32-chars-long-2026
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-minimum-32-chars-long-2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & Push Schema
        run: |
          npx prisma generate
          npx prisma db push

      - name: Run ESLint
        run: npm run lint

      - name: Run Backend Unit & Integration Tests
        run: npm test

      - name: Build TypeScript Production Bundle
        run: npm run build

  mobile-ci:
    name: Mobile Analyze, Test & Android APK Build (Flutter)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 for Android Build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install system SQLite3 for FFI tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0 libsqlite3-dev

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter Static Analysis
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests
        run: flutter test

      - name: Verify Android Debug APK Build
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi
          flutter build apk --debug
